services:
  api:
    build: .
    ports:
      - "8001:8001"
    command: >
      python -m uvicorn fraudshield.api.main:app
      --host 0.0.0.0 --port 8001

  ui:
    build: .
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8001/v1/predict
    command: >
      streamlit run streamlit_app.py
      --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
